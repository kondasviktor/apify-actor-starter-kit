name: Sync to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "hf-space/**"
      - ".github/workflows/sync-huggingface.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Upload Static Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: kondasviktor/apify-actor-starter-kit
        run: |
          set -euo pipefail
          if [[ -z "${HF_TOKEN}" ]]; then
            echo "::error::HF_TOKEN repository secret is missing (Settings → Secrets and variables → Actions → Repository secrets)."
            exit 1
          fi
          if [[ ${#HF_TOKEN} -lt 20 ]]; then
            echo "::error::HF_TOKEN looks too short — check for copy/paste issues."
            exit 1
          fi
          uvx hf repos create "${HF_REPO_ID}" --type space --space-sdk static --exist-ok
          cd hf-space
          uvx hf upload "${HF_REPO_ID}" . \
            --type space \
            --exclude=".git*" \
            --commit-message "Sync from GitHub"

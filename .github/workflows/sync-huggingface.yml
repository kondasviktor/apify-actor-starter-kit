name: Sync to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "hf-space/**"
      - ".github/workflows/sync-huggingface.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Upload Static Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: kondasviktor/apify-actor-starter-kit
        run: |
          set -euo pipefail
          if [[ -z "${HF_TOKEN}" ]]; then
            echo "::error::HF_TOKEN is missing (Repository secrets, not Environments)."
            exit 1
          fi
          uvx hf auth whoami
          uvx hf repos create "${HF_REPO_ID}" --type space --space-sdk static --exist-ok
          cd hf-space
          if ! uvx hf upload "${HF_REPO_ID}" . --type space --exclude=".git*" --commit-message "Sync from GitHub"; then
            echo "::error::hf upload failed — ensure the HF token has WRITE access to ${HF_REPO_ID} (fine-grained tokens must list this Space explicitly)."
            exit 1
          fi

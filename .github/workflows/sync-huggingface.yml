name: Sync to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "hf-space/**"
      - ".github/workflows/sync-huggingface.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push hf-space to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: kondasviktor/apify-actor-starter-kit
        run: |
          set -euo pipefail
          if [[ -z "${HF_TOKEN}" ]]; then
            echo "::error::HF_TOKEN is missing (Repository secrets, not Environments)."
            exit 1
          fi
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_REPO_ID}" hf-remote
          rsync -av --delete --exclude .git hf-space/ hf-remote/
          cd hf-remote
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to push."
            exit 0
          fi
          git commit -m "Sync from GitHub"
          git push
